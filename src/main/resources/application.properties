spring.application.name=flight-booking-api
server.port=8080

api.version=v1

# Serialise LocalDateTime as ISO-8601 strings ("2026-09-15T08:30:00") rather than numeric arrays.
spring.jackson.serialization.write-dates-as-timestamps=false

# Surface the reason on 400/404/409 responses. Without this Spring returns a bare status and the
# explanations the services attach to ResponseStatusException are dropped.
server.error.include-message=always
